# Keep CI actions and packaging metadata up to date.
version: 2
updates:
  # GitHub Actions used in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Major bumps of vendored actions break CI (e.g. actions/setup-python v7 /
    # actions/checkout v7 do not exist). Only ever take minor/patch updates;
    # review major upgrades by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python packaging metadata (pyproject.toml).
  # mnemodex has zero runtime dependencies, but keep dependabot watching so
  # build/classifier metadata stays current.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3