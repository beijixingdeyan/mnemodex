name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full test matrix: 15 jobs (3 OS x 5 Python versions).
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  # Smoke test: the CLI must run and the self-contained GIF generator must
  # produce a real file. Runs once, on Ubuntu, after the matrix passes.
  smoke:
    name: Smoke (CLI + demo GIF)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Version banner
        run: python -m mnemodex --version

      - name: Generate demo GIF in a temp dir
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          cd "${WORK_DIR}"
          # Run from a temp dir with PYTHONPATH pointing at the checkout,
          # exactly like an installed launcher would behave.
          PYTHONPATH="$GITHUB_WORKSPACE" python -m mnemodex gif --out demo.gif --frames 20
          test -s demo.gif
          echo "OK: demo.gif is $(wc -c < demo.gif) bytes"